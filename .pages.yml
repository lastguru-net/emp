media:
  - name: images
    label: Images
    input: content/images
    output: /images
    categories: [ image ]
  - name: files
    label: Files
    input: assets/files
    output: /assets/files
    categories: [ document ]

content:
  - name: posts
    label: Posts
    path: content/posts
    type: collection
    fields:
    - name: title
      label: Title
      required: true
      description: The title, also used for its URL unless a permalink is set.
      type: string
    - name: date
      label: Post date
      required: true
      description: The date in `YYYY-MM-DD` format or with time in `YYYY-MM-DD HH:MM:SS` or `YYYY-MM-DD HH:MM:SS +/-TTTT` format.
      type: date
    - name: updated
      label: Update date
      description: Optional last modification date in the same formats as the date field. Used in JSON-LD, the sitemap, and Atom and JSON feeds.
      type: date
    - name: permalink
      label: Permalink
      description: Overrides the default URL for the page
      type: string
    - name: image
      label: Image
      description: Title image
      type: image
    - name: excerpt
      label: Excerpt
      description: Optional excerpt for lists and feeds. If omitted, EMP strips HTML from the first line of rendered content and truncates at 250 characters, preferably at a word boundary, followed by an ellipsis.
      type: text
    - name: tags
      label: Tags
      description: One or more tags for the post. Depending on the configuration, some (or all) of the tags are displayed in the post lists.
      type: string
      list: true
    - name: author
      label: Author
      description: Author key from siteauthors.json5, or a name. Used for author archive URLs and the displayed author.
      type: string
    - name: hidden
      label: Hidden
      description: Excludes the item from lists, feeds, search and the sitemap. Its URL is still public.
      type: boolean
    - name: pinned
      label: Pinned
      description: Places the post before unpinned posts in lists and feeds. Posts within each group are sorted newest first.
      type: boolean
    - name: body
      label: Post
      type: rich-text
  - name: pages
    label: Pages
    path: content/pages
    type: collection
    fields:
    - name: title
      label: Title
      required: true
      description: The title, also used for its URL unless a permalink is set.
      type: string
    - name: permalink
      label: Permalink
      description: Overrides the default URL for the page
      type: string
    - name: image
      label: Image
      description: Title image
      type: image
    - name: excerpt
      label: Excerpt
      description: Optional description for metadata and lists. If omitted, EMP derives it from the rendered content.
      type: text
    - name: tags
      label: Tags
      description: Tags that include the page in tag archives.
      type: string
      list: true
    - name: author
      label: Author
      description: Author key from siteauthors.json5, or a name. Used for author archive URLs and the displayed author.
      type: string
    - name: profilePage
      label: Profile page
      description: When set to `true` on a page (not a post), generates ProfilePage JSON-LD and a corresponding Person/Organization node describing the site publisher. Commonly used for pages like "About Us".
      type: boolean
    - name: hidden
      label: Hidden
      description: Excludes the item from lists, feeds, search and the sitemap. Its URL is still public.
      type: boolean
    - name: body
      label: Page
      type: rich-text
  - name: authors
    label: Authors
    path: content/_data/siteauthors.json5
    type: file
    format: json
  - name: elements
    label: Site elements
    path: content/_data/siteelements.json5
    type: file
    format: json